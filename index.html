                            { text: "B. printing", isCorrect: false, rationale: "V-ing." },
                            { text: "C. to print", isCorrect: false, rationale: "To-V." },
                            { text: "D. printed", isCorrect: true, rationale: "Cấu trúc truyền khiến bị động 'have sth + Vp2' (have brochures printed)." }
                        ],
                        evidence: "having its newly designed brochures printed",
                        evidenceTranslation: "cho in các tờ rơi mới thiết kế"
                    },
                    {
                        id: 47,
                        question: "Question 47. Two bids have been submitted for the new contract, _____ of which meet our budget requirements.",
                        questionVietnamese: "Hai hồ sơ dự thầu đã được nộp cho hợp đồng mới, không có hồ sơ nào trong số đó đáp ứng các yêu cầu ngân sách của chúng tôi.",
                        options: [
                            { text: "A. every", isCorrect: false, rationale: "Không đi với 'of'." },
                            { text: "B. most", isCorrect: false, rationale: "Dùng cho từ 3 trở lên." },
                            { text: "C. nothing", isCorrect: false, rationale: "Không dùng cho 2 đối tượng." },
                            { text: "D. neither", isCorrect: true, rationale: "Cấu trúc 'neither of which' (không cái nào trong số hai cái)." }
                        ],
                        evidence: "Two bids... neither of which meet our budget requirements",
                        evidenceTranslation: "Hai hồ sơ dự thầu... không cái nào đáp ứng ngân sách"
                    },
                    {
                        id: 48,
                        question: "Question 48. Representatives from Caldwell Industries are attending trade exhibitions to attract _____ for their new product line.",
                        questionVietnamese: "Các đại diện từ Caldwell Industries đang tham dự các triển lãm thương mại để thu hút sự chú ý của công chúng/truyền thông cho dòng sản phẩm mới của họ.",
                        options: [
                            { text: "A. publicize", isCorrect: false, rationale: "Động từ." },
                            { text: "B. publicly", isCorrect: false, rationale: "Trạng từ." },
                            { text: "C. publicity", isCorrect: true, rationale: "Danh từ 'attract publicity' (thu hút sự chú ý/truyền thông)." },
                            { text: "D. public", isCorrect: false, rationale: "Tính từ." }
                        ],
                        evidence: "attending trade exhibitions to attract publicity",
                        evidenceTranslation: "tham dự triển lãm thương mại để thu hút truyền thông"
                    },
                    {
                        id: 49,
                        question: "Question 49. The annual bonus pool was _____ distributed among employees based on performance evaluations and years of service.",
                        questionVietnamese: "Quỹ thưởng hằng năm đã được phân phối một cách công bằng giữa các nhân viên dựa trên đánh giá hiệu suất và số năm công tác.",
                        options: [
                            { text: "A. potentially", isCorrect: false, rationale: "Tiềm năng." },
                            { text: "B. respectfully", isCorrect: false, rationale: "Tôn trọng." },
                            { text: "C. uniformly", isCorrect: false, rationale: "Đồng đều." },
                            { text: "D. equitably", isCorrect: true, rationale: "Trạng từ 'equitably' (một cách công bằng/bình đẳng)." }
                        ],
                        evidence: "bonus pool was equitably distributed among employees",
                        evidenceTranslation: "quỹ thưởng được chia công bằng giữa các nhân viên"
                    },
                    {
                        id: 50,
                        question: "Question 50. Aurelia Holdings has maintained a _____ of featuring new hires in its monthly newsletter for over a decade.",
                        questionVietnamese: "Aurelia Holdings đã duy trì truyền thống giới thiệu nhân viên mới trong bản tin hằng tháng của mình trong hơn một thập kỷ.",
                        options: [
                            { text: "A. tradition", isCorrect: true, rationale: "Cụm danh từ 'maintained a tradition' (duy trì một truyền thống)." },
                            { text: "B. decision", isCorrect: false, rationale: "Quyết định." },
                            { text: "C. calendar", isCorrect: false, rationale: "Lịch." },
                            { text: "D. measure", isCorrect: false, rationale: "Biện pháp." }
                        ],
                        evidence: "maintained a tradition of featuring new hires",
                        evidenceTranslation: "duy trì truyền thống giới thiệu nhân viên mới"
                    }
                ]
            }
        };

        function App() {
            const [selectedTestId, setSelectedTestId] = useState("t1");
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);

            const currentTest = testsDatabase[selectedTestId] || testsDatabase["t1"];
            const quizData = currentTest.quizData || [];

            const handleTestChange = (e) => {
                setSelectedTestId(e.target.value);
                setUserAnswers({});
                setSubmitted(false);
                setScore(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSelect = (qId, optionIndex) => {
                if (submitted) return;
                setUserAnswers({ ...userAnswers, [qId]: optionIndex });
            };

            const handleSubmit = () => {
                let currentScore = 0;
                quizData.forEach(q => {
                    if (q.options && q.options[userAnswers[q.id]]?.isCorrect) {
                        currentScore++;
                    }
                });
                setScore(currentScore);
                setSubmitted(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleReset = () => {
                setUserAnswers({});
                setSubmitted(false);
                setScore(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const scrollToQuestion = (qId) => {
                const el = document.getElementById(`q-${qId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const answeredCount = Object.keys(userAnswers).length;
            const allAnswered = quizData.length > 0 && answeredCount === quizData.length;

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 relative">
                    {/* Top Selector Bar */}
                    <div className="bg-slate-900 text-white p-4 rounded-2xl mb-8 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-md">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">📝</span>
                            <span className="font-bold text-base md:text-lg">TOEIC Part 5 Practice App</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <label htmlFor="test-select" className="text-xs md:text-sm font-semibold text-slate-300">
                                Chọn Đề Thi:
                            </label>
                            <select 
                                id="test-select"
                                value={selectedTestId}
                                onChange={handleTestChange}
                                className="bg-slate-800 text-amber-300 font-bold px-4 py-2 rounded-xl border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                            >
                                <option value="t1">Test 01 (50 câu: Q1 - Q50)</option>
                                <option value="t2">Test 02 (50 câu: Q1 - Q50)</option>
                            </select>
                        </div>
                    </div>

                    {/* Header */}
                    <header className="text-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <span className="bg-blue-100 text-blue-700 font-bold px-4 py-1.5 rounded-full text-xs uppercase tracking-wider">
                            TOEIC 700 - 850+ (2026)
                        </span>
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800 mt-3 mb-1">
                            {currentTest.title}
                        </h1>
                        <p className="text-slate-500 text-sm font-semibold italic">
                            by Dirius
                        </p>

                        {submitted && (
                            <div className="mt-6 p-6 bg-emerald-50 rounded-xl border border-emerald-200 text-center animate-fade-in">
                                <h2 className="text-2xl font-bold text-emerald-800">
                                    Kết quả bài làm: {score} / {quizData.length} câu
                                </h2>
                                <p className="text-emerald-600 text-sm mt-1 mb-4">
                                    {score === quizData.length ? '🎉 Tuyệt vời! Bạn đã hoàn thành chính xác 100%!' : 'Bạn hãy xem chi tiết đáp án và lời giải ở phía dưới nhé.'}
                                </p>
                                <button 
                                    onClick={handleReset}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition-all duration-200"
                                >
                                    🔄 Làm lại bài test
                                </button>
                            </div>
                        )}
                    </header>

                    {/* Main Content Layout */}
                    <div className="flex flex-col lg:flex-row gap-8">
                        {/* Questions Column */}
                        <div className="flex-1 space-y-6">
                            {quizData.map((q, idx) => (
                                <div 
                                    id={`q-${q.id}`} 
                                    key={q.id}
                                    className={`p-6 rounded-2xl border transition-all bg-white shadow-sm scroll-mt-20 ${
                                        submitted 
                                            ? (q.options[userAnswers[q.id]]?.isCorrect ? 'border-emerald-300 bg-emerald-50/10' : 'border-rose-300 bg-rose-50/10') 
                                            : 'border-slate-200 hover:border-slate-300'
                                    }`}
                                >
                                    <div className="flex items-start gap-3 mb-4">
                                        <span className="bg-slate-800 text-white font-bold text-xs px-2.5 py-1 rounded-md shrink-0 mt-0.5">
                                            Câu {idx + 1}
                                        </span>
                                        <h3 className="text-base font-bold text-slate-800 leading-relaxed">
                                            {q.question}
                                        </h3>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                        {q.options.map((option, oIdx) => {
                                            let style = "border-slate-200 hover:border-blue-300 text-slate-700 bg-white";
                                            const isSelected = userAnswers[q.id] === oIdx;

                                            if (submitted) {
                                                if (option.isCorrect) {
                                                    style = "border-emerald-500 bg-emerald-100/60 text-emerald-900 font-semibold";
                                                } else if (isSelected) {
                                                    style = "border-rose-500 bg-rose-100/60 text-rose-900 font-semibold";
                                                } else {
                                                    style = "border-slate-100 text-slate-400 opacity-60 bg-white";
                                                }
                                            } else if (isSelected) {
                                                style = "border-blue-600 bg-blue-50 text-blue-900 font-semibold";
                                            }

                                            return (
                                                <button
                                                    key={oIdx}
                                                    onClick={() => handleSelect(q.id, oIdx)}
                                                    disabled={submitted}
                                                    className={`option-card text-left p-3.5 border-2 rounded-xl text-sm flex items-start gap-2.5 ${style}`}
                                                >
                                                    <span>{option.text}</span>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {submitted && (
                                        <div className="mt-5 p-5 bg-emerald-50/60 rounded-xl border border-emerald-300 text-sm space-y-3 font-sans">
                                            <div className="space-y-1 text-slate-800 font-medium">
                                                <p className="font-bold text-emerald-950 mb-1.5">
                                                    🌐 Dịch câu: {q.questionVietnamese}
                                                </p>
                                                {q.options.map((opt, oIdx) => (
                                                    <p key={oIdx} className={opt.isCorrect ? "font-bold text-emerald-800" : "text-slate-600"}>
                                                        {opt.text.substring(0, 3)} {opt.rationale}
                                                    </p>
                                                ))}
                                            </div>

                                            <hr className="border-emerald-200" />

                                            <div className="text-slate-800 leading-relaxed space-y-1.5">
                                                <p>
                                                    <span className="font-semibold text-emerald-900">Manh mối / Cụm từ:</span> "{q.evidence}" – "{q.evidenceTranslation}"
                                                </p>
                                                <p className="font-bold text-emerald-700 text-base pt-1">
                                                    ➔ Chọn {String.fromCharCode(65 + q.options.findIndex(o => o.isCorrect))}
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* Sidebar Right */}
                        <div className="w-full lg:w-72 shrink-0">
                            <div className="sticky top-6 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <div>
                                    <h3 className="font-bold text-slate-800 text-base mb-3 flex items-center justify-between">
                                        <span>Danh sách câu hỏi</span>
                                        <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                                            {answeredCount}/{quizData.length}
                                        </span>
                                    </h3>

                                    <div className="grid grid-cols-4 gap-2">
                                        {quizData.map((q, idx) => {
                                            const isAnswered = userAnswers[q.id] !== undefined;
                                            const selectedOpt = userAnswers[q.id];
                                            const isCorrect = submitted && isAnswered && q.options[selectedOpt]?.isCorrect;

                                            let btnStatusClass = "";

                                            if (!submitted) {
                                                if (isAnswered) {
                                                    btnStatusClass = "bg-emerald-600 text-white font-bold border-emerald-600 shadow-sm";
                                                } else {
                                                    btnStatusClass = "bg-slate-800 text-white font-medium border-slate-800 hover:bg-slate-700";
                                                }
                                            } else {
                                                if (isCorrect) {
                                                    btnStatusClass = "bg-emerald-500 text-white font-bold ring-2 ring-emerald-300";
                                                } else {
                                                    btnStatusClass = "bg-rose-500 text-white font-bold ring-2 ring-rose-300";
                                                }
                                            }

                                            return (
                                                <button
                                                    key={q.id}
                                                    onClick={() => scrollToQuestion(q.id)}
                                                    className={`w-11 h-11 rounded-full border flex flex-col items-center justify-center text-xs transition-all transform hover:scale-105 active:scale-95 ${btnStatusClass}`}
                                                    title={`Trỏ đến câu ${idx + 1}`}
                                                >
                                                    <span>{idx + 1}</span>
                                                    {!submitted && isAnswered && (
                                                        <span className="text-[10px] leading-none">✓</span>
                                                    )}
                                                    {submitted && (
                                                        <span className="text-[10px] leading-none">
                                                            {isCorrect ? '✓' : '✕'}
                                                        </span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100 space-y-2 text-xs text-slate-600">
                                    {!submitted ? (
                                        <>
                                            <div className="flex items-center gap-2">
                                                <span className="w-3.5 h-3.5 rounded-full bg-slate-800 inline-block"></span>
                                                <span>Chưa làm</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="w-3.5 h-3.5 rounded-full bg-emerald-600 inline-block text-white text-[9px] text-center leading-3">✓</span>
                                                <span>Đã chọn</span>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="flex items-center gap-2">
                                                <span className="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block text-white text-[9px] text-center leading-3">✓</span>
                                                <span>Câu đúng</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block text-white text-[9px] text-center leading-3">✕</span>
                                                <span>Câu sai</span>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Submit Bar */}
                    <div className="sticky bottom-6 mt-10 flex justify-center">
                        {!submitted ? (
                            allAnswered ? (
                                <button
                                    onClick={handleSubmit}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-10 rounded-full shadow-xl transition-all transform hover:scale-105 active:scale-95"
                                >
                                    NỘP BÀI VÀ XEM ĐÁP ÁN
                                </button>
                            ) : (
                                <div className="bg-amber-100 border border-amber-300 text-amber-900 font-medium px-6 py-3 rounded-full shadow-md text-sm">
                                    Đã hoàn thành {answeredCount} / {quizData.length} câu (Hãy chọn đủ {quizData.length} câu để hiện nút Nộp bài)
                                </div>
                            )
                        ) : (
                            <button
                                onClick={handleReset}
                                className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-10 rounded-full shadow-xl transition-all transform hover:scale-105 active:scale-95"
                            >
                                🔄 LÀM LẠI BÀI TEST
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
